function saveAttr(i){let n=Number($("al").value),e=$("av").value.trim();if(!Number.isInteger(n)||n<1||n>100||!e)return alert("Enter a valid level and evidence.");d.attributes[i].level=n;d.attributes[i].evidence=e;d.attributes[i].provenance="Player-entered";save();render()}
function generate(target){d.missions=d.missions.filter(m=>m.target!==target);[["Knowledge","Research and explain the key principles of "+target+".",10],["Practical","Complete a real or simulated task demonstrating "+target+".",15],["Creative / reflection","Create a small output, evaluate it and explain the next improvement in "+target+".",15]].forEach((x,i)=>d.missions.push({id:"g"+Date.now()+i,target,title:x[0],brief:x[1],reward:x[2],done:false}));save();go("missions")}
function play(i){let m=d.missions[i];$("view").innerHTML='<section class="panel"><h2>'+esc(m.title)+' · '+esc(m.target)+'</h2><p>'+esc(m.brief)+'</p><p class="small">Stages: understand the objective → complete the challenge → submit evidence and reflection.</p><label>Your response / evidence (minimum 40 characters)</label><textarea id="me"></textarea><label>Self-assessment</label><select id="ms"><option value="1">1 · Initial attempt</option><option value="2">2 · Partial</option><option value="3" selected>3 · Competent</option><option value="4">4 · Strong</option><option value="5">5 · Excellent evidenced result</option></select><button class="btn primary" onclick="submitMission('+i+')">Submit mission</button><button class="btn" onclick="go(\'missions\')">Cancel</button></section>'}
function submitMission(i){let m=d.missions[i],e=$("me").value.trim(),s=Number($("ms").value);if(e.length<40)return alert("Please provide meaningful evidence (at least 40 characters).");if(m.done)return;let n=Math.round(m.reward*s/5);m.done=true;m.evidence=e;m.score=s;m.earned=n;award(n,m.title);render()}
function addGoal(){let t=$("gt").value.trim(),v=$("gd").value.trim();if(!t)return alert("Add a title.");d.goals.push({title:t,description:v,status:"active",createdBy:"Player"});save();render()}
function addActivity(){let t=$("at").value.trim(),v=$("ae").value.trim();if(!t||!v)return alert("Add activity and evidence.");d.activities.push({title:t,evidence:v,status:"unassessed",date:new Date().toISOString()});save();render()}
function analyse(){pending=$("aiInput").value.trim();if(!pending)return;$("aiResult").innerHTML='<div class="card"><h3>Preliminary analysis</h3><p>Received as player-provided information. It has not been independently verified and does not automatically earn XP.</p><p class="small">Recommended: record a date, outcome, evidence and development target.</p><button class="btn" onclick="saveInput()">Save as unverified knowledge</button></div>'}
function saveInput(){d.knowledge.push({topic:"Player input",notes:pending,source:"AI Terminal",status:"Player-provided · unverified"});pending="";save();go("archive")}
function addKnowledge(){let t=$("kt").value.trim(),n=$("kn").value.trim(),s=$("ks").value.trim();if(!t||!n)return alert("Add topic and notes.");d.knowledge.push({topic:t,notes:n,source:s,status:"Unverified"});save();render()}
function backup(){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}));a.href=u;a.download="LIFE-OS67-backup.json";a.click();URL.revokeObjectURL(u)}
function restore(){let f=$("restore").files[0];if(!f)return alert("Choose a file.");let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(x.version!==1||!x.player)throw 0;d=x;save();render()}catch(e){alert("Invalid backup")}};r.readAsText(f)}
Object.assign(window,{go,spec,editAttr,saveAttr,generate,play,submitMission,addGoal,addActivity,analyse,saveInput,addKnowledge,backup,restore});
save();render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{});}
})();
</script></body></html>
